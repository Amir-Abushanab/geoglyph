name: release

on:
  push:
    branches: [master]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  # Lets npm attest where the tarball was built from, which is the whole provenance story
  # for a package that is mostly vendored data. Costs nothing.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # Two states, one job. With changesets pending it opens or updates a version pull
      # request; with none pending — which is what merging that request leaves — it
      # publishes. So master's head goes out as soon as it is green.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: Version packages
          title: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
